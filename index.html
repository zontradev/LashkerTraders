    <!-- Instant Diagnostic & Launcher Engine: Eliminates infinite spinner & file:// issues -->
    <script>
      (function() {
        function showLauncherUI(message) {
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML = '' +
            '<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b0f19; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, \'Segoe UI\', Roboto, sans-serif; padding: 24px; text-align: center;">' +

                '<div style="width: 64px; height: 64px; border-radius: 20px; background: linear-gradient(135deg, #0284c7, #0ea5e9); margin: 0 auto 18px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: white; box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4);">LT</div>' +
                '<h2 style="font-size: 24px; font-weight: 800; margin: 0 0 10px 0; color: white;">Lashker Traders Platform</h2>' +
                '<p style="font-size: 14px; color: #94a3b8; line-height: 1.6; margin: 0 0 24px 0;">' + (message || 'Direct file opening detected. React web applications must run over local HTTP dev servers to execute JavaScript modules.') + '</p>' +
                '<div style="background: #0b0f19; border-radius: 16px; padding: 20px; margin-bottom: 24px; text-align: left; border: 1px solid #1f2937;">' +
                  '<p style="font-size: 12px; font-weight: 700; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 14px 0;">🚀 Click to Open Live Portals:</p>' +
                  '<div style="display: flex; flex-direction: column; gap: 12px;">' +
                    '<a href="http://localhost:3000" style="display: block; padding: 15px 20px; background: #0284c7; hover: background: #0369a1; border-radius: 12px; color: white; font-weight: 800; text-decoration: none; font-size: 15px; text-align: center; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);">' +
                      '🛒 Open Customer Storefront (http://localhost:3000)' +
                    '</a>' +
                    '<a href="http://localhost:3001" style="display: block; padding: 15px 20px; background: #1e293b; border: 1px solid #38bdf8; border-radius: 12px; color: #38bdf8; font-weight: 800; text-decoration: none; font-size: 15px; text-align: center;">' +
                      '⚙️ Open Client Server Console (http://localhost:3001)' +
                    '</a>' +
                  '</div>' +
                '</div>' +
                '<div style="display: flex; items-center; justify-content: space-between; font-size: 11px; color: #64748b;">' +
                  '<span>Vite Storefront Port: 3000</span>' +
                  '<span>Client Server Port: 3001</span>' +
                '</div>' +
              '</div>' +
            '</div>';
        }

        function checkEnvironment() {
          if (window.location.protocol === 'file:') {
            showLauncherUI('You opened index.html directly from Windows Explorer (file://). Browsers block module scripts on the local file system. Please click below to open the live application:');
            return;
          }

          // Watchdog: If initial loader is still present after 2.5s, provide direct link recovery
          setTimeout(function() {
            var loader = document.getElementById('initial-loader');
            if (loader && loader.parentElement) {
              showLauncherUI('Connecting to Lashker Traders Vite server... If the app did not start automatically, click below to open directly:');
            }
          }, 2500);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', checkEnvironment);
        } else {
          checkEnvironment();
        }
      })();
    </script>
